# Production stack for a VM: app + Postgres + Qdrant + import scheduler.
#   cp .env.docker.example .env.docker   (edit AUTH_URL, secrets)
#   docker compose -f docker-compose.prod.yml --env-file .env.docker up -d --build
# The app listens on ${APP_PORT:-80} of the host. Data lives in the named volumes.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: greygiraffe
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d greygiraffe"]
      interval: 5s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.13.4
    restart: unless-stopped
    volumes: ["qdrant:/qdrant/storage"]

  app:
    build: .
    image: greygiraffe:latest
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }
    ports: ["${APP_PORT:-80}:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/greygiraffe
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/greygiraffe
      QDRANT_URL: http://qdrant:6333
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: "true"
      CRON_SECRET: ${CRON_SECRET}
      DEMO_DATE: ${DEMO_DATE:-}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-alice}
      IMPORT_USER_AGENT: ${IMPORT_USER_AGENT:-greyGiraffe/0.1 (hackathon)}
      SEED_DEMO: ${SEED_DEMO:-true}
      IMPORT_ON_START: ${IMPORT_ON_START:-true}
      POPULARITY_ON_IMPORT: "true"
      NODE_ENV: production

  scheduler:
    image: greygiraffe:latest
    restart: unless-stopped
    depends_on: [app]
    entrypoint: ["node", "scripts/scheduler.mjs"]
    healthcheck: { disable: true }
    environment:
      APP_URL: http://app:3000
      CRON_SECRET: ${CRON_SECRET}
      IMPORT_TIMES: ${IMPORT_TIMES:-05:00,09:30}

volumes:
  pgdata:
  qdrant:
